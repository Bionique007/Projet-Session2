<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un événement</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #ffcc66, #6a0dad);
            text-align: center;
            padding: 40px;
            margin: 0;
        }
        form {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 30px;
            display: inline-block;
            margin: auto;
            max-width: 400px;
            text-align: left; /* Align labels and inputs properly */
        }
        input, textarea {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        button {
            padding: 10px 20px;
            background: #6a0dad;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background: #571891;
            transform: scale(1.05);
        }
        a {
            text-decoration: none;
            font-weight: bold;
            color: #fff;
            margin-top: 20px;
        }
        a:hover {
            color: #ffcc66;
        }
    </style>
</head>
<body>
    <h1>Ajouter un événement</h1>
    <form method="post" action="{{ url_for('admin.add_event') }}">
        <label for="titre">Titre :</label>
        <input type="text" id="titre" name="titre" placeholder="Titre de l'événement" required>

        <label for="date">Date :</label>
        <input type="date" id="date" name="date" required>

        <label for="cost">Coût :</label>
        <input type="number" id="cost" name="cost" placeholder="Coût de l'événement ($)" required>

        <button type="submit">Ajouter</button>
    </form>
    <p><a href="{{ url_for('admin.admin_dashboard') }}">Retour au tableau de bord admin</a></p>
    <button onclick="location.href='{{ url_for('admin.admin_logout') }}'">Déconnexion</button>
</body>
</html>
